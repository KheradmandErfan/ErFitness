<style>
  :root {
    --ease: cubic-bezier(.32, .72, 0, 1);
    --spring: cubic-bezier(.34, 1.45, .5, 1);
    --blur: 16px;
  }
  html[data-theme="dark"] {
    --bg: #07181c;
    --text: #eafaf6;
    --muted: rgba(234, 250, 246, .66);

    --gb: rgba(255, 255, 255, .2);
    --hi: rgba(255, 255, 255, .55);
    --lo: rgba(255, 255, 255, .08);
    --sh: rgba(0, 0, 0, .32);
    --spec: .16;
    --inner: rgba(255, 255, 255, .07);
    --accent: #5eead4;

    --b1: #0fb5a3; --b2: #f59e0b; --b3: #e5486a;

  }
  html[data-theme="light"] {
    --bg: #e4f2ee;
    --text: #0c2a2c;
    --muted: rgba(12, 42, 44, .66);
    --g1: rgba(255, 255, 255, .62);
    --g2: rgba(255, 255, 255, .26);
    --gb: rgba(255, 255, 255, .85);
    --hi: rgba(255, 255, 255, .95);
    --lo: rgba(12, 42, 44, .06);
    --sh: rgba(20, 70, 70, .16);
    --spec: .5;
    --inner: rgba(255, 255, 255, .5);
    --accent: #0d9488;
    --accent-ink: #ffffff;
    --b1: #2dd4bf; --b2: #fbbf24; --b3: #fb7185;
    --blob-o: .6;
  }
  html[lang="fa"] body { font-family: 'Vazirmatn', system-ui, sans-serif; }
  html[lang="en"] body { font-family: 'Outfit', 'Vazirmatn', system-ui, sans-serif; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    line-height: 1.7; overflow-x: hidden;
    transition: background-color .5s, color .5s;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  [hidden] { display: none !important; }
  h1, h2, h3, p { margin: 0; }

  /* ---------- پس‌زمینه ---------- */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; opacity: var(--blob-o); will-change: transform; }
  .blob.a { width: 52vmax; height: 52vmax; background: radial-gradient(circle, var(--b1) 0%, transparent 68%); top: -18vmax; inset-inline-start: -14vmax; animation: drift1 26s ease-in-out infinite alternate; }
  .blob.b { width: 40vmax; height: 40vmax; background: radial-gradient(circle, var(--b2) 0%, transparent 68%); bottom: -14vmax; inset-inline-end: -10vmax; animation: drift2 31s ease-in-out infinite alternate; }
  .blob.c { width: 34vmax; height: 34vmax; background: radial-gradient(circle, var(--b3) 0%, transparent 68%); top: 38%; left: 38%; opacity: calc(var(--blob-o) * .75); animation: drift3 36s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(18vmax, 14vmax) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-16vmax, -12vmax) scale(.9); } }
  @keyframes drift3 { to { transform: translate(-18vmax, 10vmax) scale(1.2); } }

  /* ---------- شیشه مایع ---------- */
  :where(.glass) { position: relative; }
  .glass {
    background: linear-gradient(145deg, var(--g1), var(--g2));
    -webkit-backdrop-filter: blur(var(--blur)) saturate(140%);
    backdrop-filter: blur(var(--blur)) saturate(140%);
    border: 1px solid var(--gb);
    box-shadow:
      inset 0 1px 1px var(--hi),
      inset 0 -1px 1px var(--lo),

    transition: transform .45s var(--spring);
  }
  .glass::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(240px circle at var(--mx, 50%) var(--my, 0%), rgba(255, 255, 255, var(--spec)), transparent 62%);
    opacity: 0; transition: opacity .35s;
  }
  .glass:hover::after { opacity: 1; }

  /* ---------- چیدمان ---------- */

  .wrap { width: min(1120px, 100% - 32px); margin-inline: auto; }

  .search-wrap { position: relative; flex: 1; max-width: 600px; margin-inline: auto; }

  .search-btn { width: calc(var(--h) - 10px); height: calc(var(--h) - 10px); border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; transition: transform .35s var(--spring); }

  .suggest {
    position: absolute; top: calc(100% + 10px); inset-inline: 0; border-radius: 24px; padding: 8px; z-index: 40;
    transform-origin: top center; transform: translateY(-8px) scale(.97); opacity: 0; pointer-events: none;
    transition: transform .4s var(--spring), opacity .25s;
  }
  .suggest.open { transform: none; opacity: 1; pointer-events: auto; }
  .sug-item { display: flex; flex-direction: column; width: 100%; text-align: start; background: none; border: 0; padding: 10px 14px; border-radius: 16px; transition: background .2s, transform .25s var(--spring); }
  .sug-item:hover, .sug-item.active { background: var(--inner); transform: translateX(3px); }
  html[dir="rtl"] .sug-item:hover, html[dir="rtl"] .sug-item.active { transform: translateX(-3px); }
  .sug-item small { color: var(--muted); }

  .view { padding-block: 8px 24px; animation: viewIn .55s var(--ease) both; }
  @keyframes viewIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* ---------- صفحه اصلی ---------- */
  .hero { display: grid; gap: 20px; grid-template-columns: 1fr; align-items: stretch; margin-bottom: 20px; }
  @media (min-width: 860px) { .hero { grid-template-columns: 1.05fr 1fr; } }
  .brand { padding: 28px 8px 8px; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
  .brand h1 { font-size: clamp(2.8rem, 10vw, 5.4rem); font-weight: 800; line-height: 1.05; letter-spacing: -.02em; }
  html[lang="fa"] .brand h1 { letter-spacing: 0; }
  .brand p { color: var(--muted); font-size: 1.1rem; max-width: 30ch; }
  .chips-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }

  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
  .card { border-radius: 30px; padding: 22px; }
  .card h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 14px; }
  .card:hover { transform: translateY(-3px); }

  .random { display: flex; flex-direction: column; gap: 10px; min-height: 270px; justify-content: space-between; }
  .random .body { transition: opacity .3s, transform .4s var(--ease); }
  .random .body.out { opacity: 0; transform: translateY(10px); }

  .btns { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn {
    padding: .65rem 1.25rem; border-radius: 999px; border: 1px solid var(--gb);
    background: var(--inner); transition: transform .35s var(--spring), background .25s, box-shadow .3s;
  }
  .btn:hover { transform: translateY(-2px); background: var(--g1); }

  .btn.primary:hover { background: var(--accent); box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 45%, transparent); }

  }
  button.chip:hover { transform: translateY(-2px); background: var(--g1); }

  .chip-x:hover { opacity: 1; color: #fb7185; }

  .muted { color: var(--muted); }

  /* ---------- تایمر اینتروال ---------- */
  .ring-wrap { position: relative; width: 176px; aspect-ratio: 1; margin: 0 auto 14px; }
  .ring { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 8; }

  .ring-fg { stroke: var(--accent); stroke-linecap: round; stroke-dasharray: 326.7; stroke-dashoffset: 0; transition: stroke .4s; }

  }

  /* ---------- کرونومتر / شمارنده / آب / BMI ---------- */
  .display { font-size: 2.6rem; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; margin-bottom: 12px; direction: ltr; }
  .laps { list-style: none; padding: 0; margin: 12px 0 0; max-height: 90px; overflow: auto; font-variant-numeric: tabular-nums; color: var(--muted); font-size: .92rem; }

  .counter { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 12px; }

  .counter .num.bump { transform: scale(1.25); }
  .round-btn { width: 54px; height: 54px; border-radius: 50%; font-size: 1.6rem; line-height: 1; padding: 0; display: grid; place-items: center; }
  .drops { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 10px; }
  .drop { aspect-ratio: 1; border-radius: 18px; border: 1px solid var(--gb); background: var(--inner); display: grid; place-items: center; padding: 0; transition: transform .35s var(--spring), background .5s calc(var(--d, 0ms) + .3s); }
  .drop svg { width: 62%; height: 62%; overflow: visible; }
  .drop .outline { fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linejoin: round; transition: stroke .4s calc(var(--d, 0ms) + .3s); }
  .drop .lvl { transform: translateY(26px); transition: transform .95s cubic-bezier(.3, .75, .25, 1) var(--d, 0ms); }
  .drop .wave { fill: var(--accent); animation: wave 1.5s linear infinite; animation-play-state: paused; }
  .drop.on .lvl { transform: translateY(0); }

  .drop.on .outline { stroke: var(--accent); }
  .drop.on { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .drop.pop svg { animation: dpop .55s var(--spring); }
  .drop:active { transform: scale(.88); }
  @keyframes wave { to { transform: translateX(-24px); } }
  @keyframes dpop { 0% { transform: scale(1); } 40% { transform: scale(1.25) rotate(-6deg); } 100% { transform: scale(1); } }
  .bmi-out { margin-top: 12px; min-height: 3.2em; }
  .bmi-out b { font-size: 1.8rem; margin-inline-end: 8px; }

  /* ---------- نتایج و جزئیات ---------- */
  .page-head { display: flex; align-items: center; gap: 12px; margin: 10px 0 20px; flex-wrap: wrap; }
  .page-head h2 { font-size: 1.5rem; font-weight: 800; }
  .back { display: inline-flex; align-items: center; gap: 6px; }
  .back svg { width: 18px; height: 18px; }
  html[dir="rtl"] .back svg { transform: scaleX(-1); }
  .lib { grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 10px; }
  .res-card { display: flex; flex-direction: column; gap: 8px; width: 100%; text-align: start; border-radius: 22px; padding: 16px 18px; border: 1px solid var(--gb); background: var(--inner); transition: transform .35s var(--spring), background .25s; }

  .fchip { transition: transform .3s var(--spring), background .25s; }

  .article { border-radius: 30px; padding: 26px; }

  @media (min-width: 820px) { .art-top { grid-template-columns: 320px minmax(0, 1fr); align-items: start; } }

  .fig .mu { fill: rgba(128, 150, 150, .2); stroke: var(--gb); stroke-width: .6; transition: fill .6s; }

  a.btn { text-decoration: none; display: inline-block; }

  /* ---------- پنل کناری ---------- */
  .scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0, 10, 12, .38); opacity: 0; pointer-events: none; transition: opacity .45s; }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; z-index: 60; top: 12px; bottom: 12px; right: 12px; left: auto;
    width: min(86vw, 340px); border-radius: 32px; padding: 20px; display: flex; flex-direction: column; gap: 12px;
    transform: translateX(calc(100% + 30px)); transition: transform .6s var(--ease);
  }

  .drawer-head h2 { font-size: 1.3rem; font-weight: 800; }
  .close-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--gb); background: var(--inner); display: grid; place-items: center; padding: 0; transition: transform .4s var(--spring); }
  .close-btn:hover { transform: rotate(90deg) scale(1.08); }
  .close-btn svg { width: 18px; height: 18px; }
  .d-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; border-radius: 22px; border: 1px solid var(--gb); background: var(--inner); text-align: start; font-weight: 600; transition: transform .35s var(--spring), background .25s; }
  .d-item:hover { background: var(--g1); transform: scale(1.02); }
  .d-item:active { transform: scale(.97); }
  .d-item svg.ic { width: 22px; height: 22px; flex: none; }

  .d-item[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .drawer.open .d-anim { animation: itemIn .55s var(--ease) both; animation-delay: calc(var(--i) * 70ms + 150ms); }
  @keyframes itemIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
  .acc { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s var(--ease); }
  .acc.open { grid-template-rows: 1fr; }
  .acc > div { overflow: hidden; }
  .seg { display: flex; flex-direction: column; gap: 8px; padding: 10px 2px 2px; }
  .seg button { padding: 11px 16px; border-radius: 18px; border: 1px solid var(--gb); background: var(--inner); text-align: start; display: flex; align-items: center; gap: 10px; transition: transform .3s var(--spring), background .25s, border-color .25s; }
  .seg button::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); transition: all .3s var(--spring); }
  .seg button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .seg button[aria-pressed="true"]::before { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
  .seg button:active { transform: scale(.96); }

  /* ---------- برنامه ورزشی ---------- */
  .sheet {
    position: fixed; z-index: 60; top: 50%; left: 50%; width: min(94vw, 860px); max-height: 90vh; border-radius: 34px;
    display: flex; flex-direction: column; overflow: hidden;
    transform: translate(-50%, -46%) scale(.92); opacity: 0; pointer-events: none;
    transition: transform .6s var(--ease), opacity .35s;
  }
  .sheet.open { transform: translate(-50%, -50%); opacity: 1; pointer-events: auto; }
  .sheet-head { padding: 22px 24px 8px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .sheet-head h2 { font-size: 1.4rem; font-weight: 800; }
  .sheet-body { padding: 8px 24px 12px; overflow-y: auto; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); }
  .day { border-radius: 24px; padding: 16px; background: var(--inner); border: 1px solid var(--gb); display: flex; flex-direction: column; gap: 10px; transition: border-color .3s, box-shadow .3s; }
  .day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .day h4 { margin: 0; font-size: 1.02rem; display: flex; align-items: center; gap: 8px; }
  .day h4 .badge { font-size: .72rem; padding: 1px 10px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .day .list { display: flex; flex-wrap: wrap; gap: 6px; min-height: 34px; align-items: flex-start; }
  .add-row { display: flex; gap: 6px; }
  .add-row input { flex: 1; min-width: 0; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--gb); background: var(--inner); outline: none; transition: box-shadow .25s; }
  .add-row input:focus { box-shadow: 0 0 0 2px var(--accent); }
  .add-row .btn { padding: .4rem 1rem; }
  .sheet-foot { padding: 14px 24px 22px; display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }


  .site-foot { position: fixed; z-index: 25; inset-inline: 0; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 70px); display: flex; justify-content: center; pointer-events: none; }
  .foot-seo { color: var(--muted); font-size: .75rem; text-align: center; margin: 0; padding: 0 16px 140px; }
  .made { pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; padding: 6px 16px; border-radius: 999px; font-size: .82rem; direction: ltr; }
  html[dir="rtl"] .made { direction: rtl; }
  .made:hover { transform: scale(1.05); }
  .heart { width: 16px; height: 16px; fill: #ef4444; transform-origin: center; animation: beat 1.3s ease-in-out infinite; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.28); } 28% { transform: scale(1); } 42% { transform: scale(1.2); } 70% { transform: scale(1); } }
  /* ---------- نوار صفحه‌ها ---------- */
  .tabbar {
    position: fixed; z-index: 25; bottom: max(12px, env(safe-area-inset-bottom)); left: 0; right: 0; margin-inline: auto;
    width: min(94vw, 440px); height: 62px; padding: 5px; border-radius: 999px; display: flex;
  }
  .tab-ind { position: absolute; top: 5px; bottom: 5px; left: 0; width: 0; border-radius: 999px; background: var(--accent); opacity: .92; transition: transform .55s var(--ease), width .55s var(--ease); pointer-events: none; }
  .tab { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border: 0; background: none; border-radius: 999px; font-size: .74rem; font-weight: 600; text-decoration: none; color: var(--muted); transition: color .3s, transform .35s var(--spring); }
  .tab svg { width: 21px; height: 21px; }
  .tab:active { transform: scale(.94); }
  .tab[aria-current="page"] { color: var(--accent-ink); }

  /* ---------- داده و تحلیل ---------- */
  .data-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
  .data-grid .wide { grid-column: 1 / -1; }
  .chart { position: relative; margin-top: 6px; }
  .chart-area { position: relative; height: 170px; }
  .gl { position: absolute; inset-inline: 0; border-top: 1px dashed var(--gb); opacity: .7; }
  .gl span { position: absolute; inset-inline-start: 0; top: -1.3em; font-size: .7rem; color: var(--muted); }
  .cols { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .col { height: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 3px; }
  .bar { width: clamp(8px, 2.4vw, 16px); height: 0; border-radius: 8px 8px 3px 3px; transition: height .9s var(--ease) calc(var(--i) * 70ms); }
  .bar.cur { background: var(--accent); }
  .bar.prev { background: var(--muted); opacity: .35; }
  .chart.in .bar { height: calc(var(--h) * 100%); }
  .labels { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; margin-top: 8px; }
  .labels b { display: block; font-size: .85rem; font-variant-numeric: tabular-nums; }
  .labels span { font-size: .78rem; color: var(--muted); }
  .labels .today b, .labels .today span { color: var(--accent); font-weight: 800; }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .82rem; color: var(--muted); margin-top: 12px; }
  .chart-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; background: var(--accent); }
  .chart-legend i.p { background: var(--muted); opacity: .45; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 16px; }
  .stat { background: var(--inner); border: 1px solid var(--gb); border-radius: 18px; padding: 10px 14px; }
  .stat small { color: var(--muted); display: block; font-size: .78rem; }
  .stat b { font-size: 1.05rem; }
  .tip-ic { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 12px; background: var(--inner); border: 1px solid var(--gb); }
  .tip-ic svg { width: 26px; height: 26px; }
  .tip.up .tip-ic { color: #22c55e; } .tip.down .tip-ic { color: #f97316; } .tip.flat .tip-ic { color: var(--accent); }
  .tip p { max-width: 40ch; }
  .tip .pct { font-size: 1.8rem; font-weight: 800; margin-bottom: 4px; }
  select { width: 100%; padding: 8px 10px; border-radius: 14px; border: 1px solid var(--gb); background: var(--inner); color: var(--text); outline: none; }
  select option { color: #111; }

  .toast {
    position: fixed; z-index: 90; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 118px); left: 50%; transform: translate(-50%, 30px) scale(.9);
    padding: 12px 22px; border-radius: 999px; opacity: 0; pointer-events: none; transition: transform .5s var(--spring), opacity .3s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (hover: none) { .glass::after { display: none; } }
  @media (max-width: 520px) {
    :root { --blur: 12px; }
    .topbar { gap: 8px; padding-inline: 12px; }
    .icon-btn { width: 44px; height: 44px; }
    .search { --h: 44px; padding-inline-start: 14px; }
    .card { padding: 18px; border-radius: 26px; }
    .sheet-head, .sheet-body, .sheet-foot { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }
  html.theme-anim *, html.theme-anim *::before { transition: background-color .5s, color .5s, border-color .5s, box-shadow .5s !important; }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="blob a"></div><div class="blob b"></div><div class="blob c"></div></div>

<div id="app">
  <header class="topbar">
    <button id="langBtn" class="glass icon-btn lang-btn" type="button" data-i18n-aria="langName"><span id="langText">EN</span></button>

    <div class="search-wrap">
      <form id="searchForm" class="glass search" role="search" autocomplete="off">
        <input id="q" type="search" data-i18n-ph="searchPh" data-i18n-aria="search" enterkeyhint="search" autocomplete="off" spellcheck="false">
        <button class="search-btn" type="submit" data-i18n-aria="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
      </form>
      <div id="suggest" class="glass suggest" role="listbox"></div>
    </div>

    <button id="menuBtn" class="glass icon-btn" type="button" aria-expanded="false" aria-controls="drawer" data-i18n-aria="menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>

  <div class="wrap">
    <!-- صفحه اصلی -->
    <main id="view-home" class="view">
      <section class="hero">
        <div class="brand">
          <h1 data-i18n="brand"></h1>
          <p data-i18n="tagline"></p>
          <div class="chips-row" id="quickChips"></div>
        </div>
        <article class="card glass random" id="randomCard"></article>
      </section>

      <section class="grid">
        <article class="card glass" id="wToday"></article>

      </section>

      <section id="library">
        <div class="lib-head"><h2 id="libTitle"></h2><div id="libFilters"></div></div>
        <div class="grid lib" id="libGrid"></div>
        <button class="btn" id="libMore" type="button" hidden></button>
      </section>
    </main>

    <!-- نتایج جستجو -->
    <main id="view-results" class="view" hidden></main>
    <!-- صفحه حرکت -->
    <main id="view-detail" class="view" hidden></main>
    <!-- اندازه‌گیری‌ها -->
    <main id="view-measure" class="view" hidden>
      <div class="page-head"><h2 data-i18n="measureTitle"></h2></div>
      <section class="grid">
        <article class="card glass">
          <h3 data-i18n="wInterval"></h3>
          <div class="ring-wrap">
            <svg class="ring" viewBox="0 0 120 120" aria-hidden="true"><circle class="ring-bg" cx="60" cy="60" r="52"/><circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52"/></svg>
            <div class="ring-text"><div class="big" id="ivTime">00:00</div><div class="small" id="ivPhase"></div></div>
          </div>
          <div class="fields">
            <label class="field"><span data-i18n="work"></span><input id="ivWork" type="number" inputmode="numeric" min="1" max="3600" value="40"></label>
            <label class="field"><span data-i18n="rest"></span><input id="ivRest" type="number" inputmode="numeric" min="0" max="3600" value="20"></label>
            <label class="field"><span data-i18n="rounds"></span><input id="ivRounds" type="number" inputmode="numeric" min="1" max="99" value="8"></label>
          </div>
          <div class="btns"><button class="btn primary" id="ivStart" type="button"></button><button class="btn" id="ivReset" type="button" data-i18n="reset"></button></div>
        </article>

        <article class="card glass">
          <h3 data-i18n="wStopwatch"></h3>
          <div class="display" id="swTime">00:00.0</div>
          <div class="btns"><button class="btn primary" id="swStart" type="button"></button><button class="btn" id="swLap" type="button" data-i18n="lap"></button><button class="btn" id="swReset" type="button" data-i18n="reset"></button></div>
          <ol class="laps" id="swLaps"></ol>
        </article>

        <article class="card glass">
          <h3 data-i18n="wCounter"></h3>
          <div class="counter">
            <button class="btn round-btn" id="cMinus" type="button" aria-label="-">−</button>
            <div class="num" id="cNum">0</div>
            <button class="btn round-btn primary" id="cPlus" type="button" aria-label="+">+</button>
          </div>
          <p class="muted" style="text-align:center;margin-bottom:12px" id="cSet"></p>
          <div class="btns" style="justify-content:center"><button class="btn" id="cNext" type="button" data-i18n="nextSet"></button><button class="btn" id="cReset" type="button" data-i18n="reset"></button></div>
        </article>

        <article class="card glass">
          <h3 data-i18n="wWater"></h3>
          <div class="drops" id="drops"></div>
          <p class="muted" id="waterTxt"></p>
        </article>

        <article class="card glass">
          <h3 data-i18n="wBmi"></h3>
          <div class="fields" style="grid-template-columns:1fr 1fr">
            <label class="field"><span data-i18n="height"></span><input id="bmiH" type="number" inputmode="decimal" min="50" max="250"></label>
            <label class="field"><span data-i18n="weight"></span><input id="bmiW" type="number" inputmode="decimal" min="10" max="400"></label>
          </div>
          <div class="bmi-out" id="bmiOut"></div>
        </article>
      </section>
    </main>

    <!-- داده و تحلیل -->
    <main id="view-data" class="view" hidden>
      <div class="page-head"><h2 data-i18n="dataTitle"></h2></div>
      <section class="grid data-grid">
        <article class="card glass wide" id="wChart"></article>
        <article class="card glass" id="wTip"></article>
        <article class="card glass" id="wLog">
          <h3 data-i18n="logTitle"></h3>
          <label class="field" style="margin-bottom:12px"><span data-i18n="logDay"></span><select id="logDay"></select></label>
          <div class="btns" id="logQuick" style="margin-bottom:12px">
            <button class="btn small" type="button" data-add="10"></button>
            <button class="btn small" type="button" data-add="20"></button>
            <button class="btn small" type="button" data-add="30"></button>
            <button class="btn small" type="button" data-add="45"></button>
          </div>
          <div class="add-row">
            <input id="logMin" type="number" inputmode="numeric" min="1" max="600" data-i18n-ph="logPh">
            <button class="btn primary small" id="logAdd" type="button" data-i18n="addEx"></button>
          </div>
          <button class="btn small" id="logClear" type="button" style="margin-top:12px" data-i18n="logClear"></button>
        </article>
      </section>
    </main>

    <p class="foot-seo">ErFitness by Erfan &nbsp;|&nbsp; ورزش‌یار توسط عرفان</p>
  </div>
</div>


<footer class="site-foot">
  <div class="glass made" id="made">
    <span data-i18n="madeA">ساخته‌شده با</span>
    <svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.7-9.4C.9 8.4 2.6 4.8 6.1 4.5c2-.2 3.9.8 5.9 3 2-2.2 3.9-3.2 5.9-3 3.5.3 5.2 3.9 3.8 7.1C19.500 16.400 12 21 12 21Z"/></svg>
    <span data-i18n="madeB">توسط عرفان</span>
  </div>
</footer>

<nav class="glass tabbar" id="tabbar" aria-label="pages">
  <span class="tab-ind" id="tabInd"></span>
  <a class="tab" href="#/" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg><span data-i18n="tabHome"></span></a>
  <a class="tab" href="#/data" data-tab="data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg><span data-i18n="tabData"></span></a>
  <a class="tab" href="#/measure" data-tab="measure"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 13l3.5-3.5M9 3h6"/></svg><span data-i18n="tabMeasure"></span></a>
</nav>

<div id="scrim" class="scrim"></div>

<!-- پنل کناری -->
<aside id="drawer" class="glass drawer" inert aria-label="menu">
  <div class="drawer-head">
    <h2 data-i18n="menu"></h2>
    <button class="close-btn" id="drawerClose" type="button" data-i18n-aria="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <button class="d-item d-anim" style="--i:0" id="openPlan" type="button">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M8 3v4M16 3v4M3.5 10h17M8 14h3"/></svg>
    <span data-i18n="plan"></span>
  </button>
  <div class="d-anim" style="--i:1">
    <button class="d-item" id="themeToggle" type="button" aria-expanded="false" aria-controls="themeAcc">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
      <span data-i18n="theme"></span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="acc" id="themeAcc"><div>
      <div class="seg" id="themeSeg">
        <button type="button" data-theme="dark" aria-pressed="false" data-i18n="dark"></button>
        <button type="button" data-theme="light" aria-pressed="false" data-i18n="light"></button>
        <button type="button" data-theme="auto" aria-pressed="false" data-i18n="auto"></button>
      </div>
    </div></div>
  </div>
</aside>

<!-- برنامه ورزشی -->
<section id="planSheet" class="glass sheet" inert role="dialog" aria-modal="true" aria-labelledby="planTitle">
  <div class="sheet-head">
    <div><h2 id="planTitle" data-i18n="planTitle"></h2><p class="muted" data-i18n="planSub"></p></div>
    <button class="close-btn" id="planClose" type="button" data-i18n-aria="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="sheet-body" id="planBody"></div>
  <div class="sheet-foot" id="planFoot"></div>
</section>
<datalist id="exList"></datalist>
<div id="toast" class="glass toast" role="status" aria-live="polite"></div>

<script src="ex1.js"></script>
<script src="ex2.js"></script>
<script src="ex3.js"></script>
<script src="ex4.js"></script>
<script src="data.js"></script>
<script src="body.js"></script>
<script src="app.js"></script>
</body>
</html>
